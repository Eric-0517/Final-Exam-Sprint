  <style>
    .exclusive-subject-filter-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
    }

    .exclusive-subject-filter-label {
      color: #64748b;
      font-size: 13px;
      white-space: nowrap;
    }

    .custom-subject-dropdown {
      position: relative;
      width: 180px;
      max-width: 100%;
      z-index: 20;
    }

    .subject-dropdown-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #fff;
      color: #3156d3;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }

    .subject-dropdown-trigger:hover,
    .subject-dropdown-trigger[aria-expanded="true"] {
      border-color: #3156d3;
      box-shadow: 0 0 0 3px rgba(49, 86, 211, .08);
    }

    .subject-dropdown-trigger:focus-visible,
    .subject-dropdown-option:focus-visible {
      outline: 2px solid #3156d3;
      outline-offset: 2px;
    }

    .subject-dropdown-arrow {
      flex-shrink: 0;
      width: 8px;
      height: 8px;
      border-right: 2px solid #3156d3;
      border-bottom: 2px solid #3156d3;
      transform: rotate(45deg) translateY(-2px);
      transition: transform .2s;
    }

    .subject-dropdown-trigger[aria-expanded="true"] .subject-dropdown-arrow {
      transform: rotate(225deg) translateY(-2px);
    }

    .subject-dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      max-height: 280px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, .13);
      animation: subjectDropdownIn .18s ease;
    }

    .subject-dropdown-menu[hidden] {
      display: none;
    }

    @keyframes subjectDropdownIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .subject-dropdown-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #334155;
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: .15s;
    }

    .subject-dropdown-option:hover {
      background: #f1f5ff;
      color: #3156d3;
    }

    .subject-dropdown-option.active {
      background: #edf2ff;
      color: #3156d3;
      font-weight: 600;
    }

    .subject-dropdown-check {
      font-size: 14px;
      color: #3156d3;
    }

    @media (max-width: 480px) {
      .exclusive-subject-filter-wrap {
        margin-bottom: 14px;
      }

      .custom-subject-dropdown {
        width: 170px;
      }

      .subject-dropdown-menu {
        max-height: 240px;
      }
    }
  </style>

  <script>
    (() => {
      "use strict";

      const toggle = document.getElementById("navToggle");
      const nav = document.getElementById("sideNav");
      const overlay = document.getElementById("navOverlay");

      if (!toggle || !nav || !overlay) return;

      function openNav() {
        toggle.classList.add("active");
        nav.classList.add("open");
        overlay.classList.add("show");
        document.body.classList.add("nav-open");

        toggle.setAttribute("aria-expanded", "true");
        toggle.setAttribute("aria-label", "關閉導覽選單");
        nav.setAttribute("aria-hidden", "false");
        nav.inert = false;
      }

      function closeNav() {
        toggle.classList.remove("active");
        nav.classList.remove("open");
        overlay.classList.remove("show");
        document.body.classList.remove("nav-open");

        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "開啟導覽選單");
        nav.setAttribute("aria-hidden", "true");
        nav.inert = true;
      }

      toggle.addEventListener("click", () => {
        nav.classList.contains("open") ? closeNav() : openNav();
      });

      overlay.addEventListener("click", closeNav);

      nav.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", closeNav);
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeNav();

          if (typeof window.closeExclusiveVideo === "function") {
            window.closeExclusiveVideo();
          }
        }
      });

      closeNav();
    })();
  </script>
