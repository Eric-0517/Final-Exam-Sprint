
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>考前衝刺｜專屬線上學習資源</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/exclusive.js" defer></script>
  <style>
    .exclusive-wrap {
      width: min(1000px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    .exclusive-card {
      padding: 28px;
      background: #fff;
      border: 1px solid #e4e8f0;
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .exclusive-card h1 {
      margin-top: 0;
      font-size: clamp(24px, 4vw, 32px);
    }

    .exclusive-empty {
      padding: 20px;
      border-radius: 12px;
      background: #f4f6fb;
      color: #687386;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">考前衝刺</a>
    <span class="sub">專屬線上學習資源</span>
  </header>

  <main class="exclusive-wrap">
    <section class="exclusive-card">
      <h1>專屬線上學習資源</h1>
      <p>這裡提供已開通使用者的專屬學習資源。</p>

      <div id="exclusiveContent" class="exclusive-empty">
        載入中……
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a href="index.html">返回首頁</a>
    <p>考前衝刺</p>
  </footer>

  <script>
    document.addEventListener("exclusive-access-ready", () => {
      const content = document.getElementById("exclusiveContent");
      content.className = "";
      content.textContent = "權限驗證成功。";
    });
  </script>
</body>
</html>
