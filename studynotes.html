<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>重點整理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <a class="brand" href="index.html" style="text-decoration:none;color:inherit">考前衝刺</a>
    <div class="sub">
        重點整理
        <a href="index.html" style="color:inherit; margin-left:10px;">返回首頁</a>
    </div>
</header>
<main id="app">
  <section class="screen active" style="padding: 20px 0;">
    <div class="hero">
      <span class="tag">STUDY NOTES</span>
      <h1>重點整理</h1>
      <p>考前不知道要看什麼？各科重點幫你整理好了，選擇科目就能開始複習。</p>
    </div>

    <div class="subjects-grid" style="display:grid; gap:15px; max-width:800px; margin:20px auto;">
      
     
      <div class="subject-card" onclick="location.href='studynotes/accounting.html'" style="cursor:pointer;">
        <div>
          <div class="subject-title">會計學</div>
          <div class="subject-meta">會計之基本概念、會計循環、會計帳簿與財務報表...</div>
        </div>
        <button class="primary">進入單元</button>
      </div>

     
      <div class="subject-card" onclick="location.href='studynotes/business.html'" style="cursor:pointer;">
        <div>
          <div class="subject-title">商業概論</div>
          <div class="subject-meta">商業基本概念、企業家精神與創業、商業現代化機能...</div>
        </div>
        <button class="primary">進入單元</button>
      </div>

     
      <div class="subject-card" onclick="location.href='economics.html'" style="cursor:pointer;">
        <div>
          <div class="subject-title">經濟學</div>
          <div class="subject-meta">經濟基本概念、需求與供給、消費行為理論...</div>
        </div>
        <button class="primary">進入單元</button>
      </div>

    
      <div class="subject-card" onclick="location.href='Introduction.html'" style="cursor:pointer;">
        <div>
          <div class="subject-title">數位科技概論</div>
          <div class="subject-meta">資料與資訊、數位資料的表示方式、資料數位化之原理與方法...</div>
        </div>
        <button class="primary">進入單元</button>
      </div>

     
      <div class="subject-card" onclick="location.href='application.html'" style="cursor:pointer;">
        <div>
          <div class="subject-title">數位科技應用</div>
          <div class="subject-meta">認識文書處理軟體、格式編輯與排列、圖文排版...</div>
        </div>
        <button class="primary">進入單元</button>
      </div>

    </div>
  </section>
</main>
</body>
</html>
