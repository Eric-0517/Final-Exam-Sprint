<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>考前衝刺｜經濟學</title>
    <link rel="stylesheet" href="style.css">
      <style>
        .option {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            width: 100%;
            text-align: left;
        }
        .option-key {
            display: inline-flex;
            flex: 0 0 28px;
            width: 28px;
            min-width: 28px;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .option-text {
            display: block;
            flex: 1;
            min-width: 0;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }
        .option-image {
            display: block;
            max-width: min(100%, 420px);
            max-height: 240px;
            object-fit: contain;
            margin-top: 8px;
        }
        .reading-image {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 0 0 16px;
        }
        .review-options p {
            line-height: 1.7;
            overflow-wrap: anywhere;
        }
        .review-option-image {
            display: block;
            max-width: min(100%, 420px);
            max-height: 240px;
            object-fit: contain;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html" style="text-decoration:none;color:inherit">考前衝刺</a>
        <div class="sub">
            經濟學題庫　
            <a href="index.html" style="color:inherit">切換題庫</a>
        </div>
    </header>

    <main id="app">
        <section id="home" class="screen active">
            <div class="hero">
                <span class="tag">ECONOMICS</span>
                <h1>考前衝刺</h1>
                <p>範圍經濟學第1~5章模擬試題。</p>
            </div>

            <div class="subject-card">
                <div>
                    <div class="subject-title">經濟學(第1次模擬考)啟芳</div>
                    <div class="subject-meta">
                        <span id="bankCount">載入中</span> 題題庫　
                        ·　每回 40 題　
                        ·　每題 2.5 分
                    </div>
                </div>
                <button class="primary" id="startBtn">開始測驗</button>
            </div>

            <div class="info-grid">
                <div>
                    <b>40 題</b>
                    <span>不隨機抽題</span>
                </div>
                <div>
                    <b>100 分</b>
                    <span>測驗滿分</span>
                </div>
                <div>
                    <b>自動閱卷</b>
                    <span>完成後立即看結果</span>
                </div>
            </div>

            <div class="notice">按左上方「考前衝刺」可返回科目首頁。</div>
            <div id="loadError" class="notice" hidden></div>
        </section>

        <section id="quiz" class="screen">
            <div class="quiz-head">
                <button class="ghost" id="quitBtn">退出</button>

                <div class="progress-wrap">
                    <div class="progress-text">
                        <span id="qNo">1</span> /
                        <span id="total">50</span>
                    </div>
                    <div class="progress">
                        <i id="progressBar"></i>
                    </div>
                </div>

                <div class="score-mini">每題 2.5 分</div>
            </div>

            <article class="question-card">
                <div id="questionText" class="english-question"></div>
                <div class="options" id="options"></div>
            </article>

            <div class="quiz-actions">
                <button id="prevBtn" class="secondary">上一題</button>
                <button id="nextBtn" class="primary">下一題</button>
            </div>
        </section>

        <section id="result" class="screen">
            <div class="result-card">
                <div class="tag">TEST RESULT</div>
                <h2>測驗完成</h2>
                <div class="score" id="score">0</div>
                <div class="score-label">分</div>

                <div class="result-stats">
                    <div>
                        <b id="correctCount">0</b>
                        <span>答對</span>
                    </div>
                    <div>
                        <b id="wrongCount">0</b>
                        <span>答錯</span>
                    </div>
                    <div>
                        <b id="accuracy">0%</b>
                        <span>正確率</span>
                    </div>
                </div>
            </div>

            <div class="wrong-head">
                <h3>錯題與詳解</h3>
                <span id="wrongSummary"></span>
            </div>

            <div id="wrongList" class="wrong-list"></div>

            <div class="result-actions">
                <button class="secondary" id="homeBtn">回首頁</button>
                <button class="primary" id="againBtn">再測一次</button>
            </div>
        </section>
    </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/study-data.js"></script>
 <script src="economics.js"></script>
</body>
</html>
