<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>考前衝刺｜考前總複習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">考前衝刺</div>
  <div class="sub">選擇題庫</div>
</header>
<main id="app">
  <section class="screen active">
    <div class="hero">
      <span class="tag">STUDY CENTER</span>
      <h1>選擇練習科目</h1>
      <p>請選擇要練習的題庫，進入對應的測驗頁面。</p>
    </div>
    <a class="subject-card" href="accounting.html" style="text-decoration:none;color:inherit;display:flex">
      <div>
        <div class="subject-title">會計易如反掌(段考範圍）</div>
        <div class="subject-meta">每回25 題/每題 4 分、滿分 100 分</div>
      </div>
      <span class="primary" style="display:inline-flex;align-items:center">進入題庫</span>
    </a>
    <a class="subject-card merged-subject" href="english.html" style="text-decoration:none;color:inherit;margin-top:16px;display:flex">
      <div>
        <div class="subject-title">英文閱讀與寫作(段考範圍)</div>
        <div class="subject-meta">每回50 題/每題 2 分、滿分 100 分</div>
      </div>
      <span class="primary" style="display:inline-flex;align-items:center">進入題庫</span>
    </a>
    <a class="subject-card merged-subject" href="english-fifth-u1.html" style="text-decoration:none;color:inherit;margin-top:16px;display:flex">
      <div>
        <div class="subject-title">英文第五冊U1(段考範圍)</div>
        <div class="subject-meta">每回50 題/每題 2 分、滿分 100 分</div>
      </div>
      <span class="primary" style="display:inline-flex;align-items:center">進入題庫</span>
    </a>
    <div class="info-grid">
      <div><b>題目由系統隨機抽選</b><span>每次測驗題目不同</span></div>
      <div><b>滿分100分</b><span>依科目設定計分</span></div>
      <div><b>自動閱卷</b><span>交卷後查看測驗結果</span></div>
    </div>
  </section>
</main>
</body>
</html>
