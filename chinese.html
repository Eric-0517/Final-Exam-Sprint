<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>考前衝刺｜國文 </title>
<style>
:root{--bg:#f4f6fb;--panel:#fff;--text:#172033;--muted:#687386;--blue:#3156d3;--line:#e4e8f0;--red:#dc2626;--green:#16845b;--shadow:0 10px 30px rgba(22,34,61,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.65}.topbar{height:64px;background:#111a2e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1000px)/2));gap:16px}.brand{font-size:19px;font-weight:800;color:inherit;text-decoration:none}.sub{font-size:13px;color:#d0d7e7}main{max-width:900px;margin:32px auto;padding:0 18px}.screen{display:none}.screen.active{display:block}.hero,.subject-card,.info-grid>div,.question-card,.result-card,.wrong-item{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.hero{padding:32px;margin-bottom:18px;background:linear-gradient(130deg,#182642,#253f77);color:#fff}.tag{font-size:12px;letter-spacing:1.5px;font-weight:800;color:#9cb7ff}.hero h1{font-size:clamp(28px,5vw,40px);margin:8px 0}.hero p{margin:0;color:#dce5ff}.subject-card{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px;margin-bottom:16px}.subject-title{font-size:22px;font-weight:800}.subject-meta{color:var(--muted);font-size:14px;margin-top:4px}.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.info-grid>div{padding:18px;text-align:center}.info-grid b,.info-grid span{display:block}.info-grid b{font-size:20px}.info-grid span{font-size:13px;color:var(--muted)}button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;font-weight:700;transition:.15s}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);color:white}.primary:hover{filter:brightness(1.08)}.secondary{background:#e8edf8;color:#25365b}.ghost{background:transparent;color:#4b5871;border:1px solid var(--line)}.notice{padding:14px 16px;background:#edf2ff;border-radius:12px;color:#3b4f82;font-size:14px;margin-top:14px}.quiz-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}.progress-wrap{flex:1}.progress-text{font-size:14px;font-weight:800;margin-bottom:5px}.progress{height:7px;border-radius:10px;background:#dfe5f1;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}.score-mini{font-size:13px;color:var(--muted);white-space:nowrap}.question-card{padding:clamp(20px,4vw,32px)}.question-meta{font-size:12px;color:var(--blue);font-weight:800;margin-bottom:8px}.question-prompt{font-size:19px;font-weight:750;white-space:pre-wrap;line-height:1.8;margin-bottom:20px}.passage{white-space:pre-wrap;background:#f7f8fc;border-left:4px solid #8ca4e8;padding:15px 18px;border-radius:8px;margin:0 0 18px;color:#3c4960}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid #dce2ee;color:var(--text);padding:14px;border-radius:12px;line-height:1.7}.option:hover{border-color:#9aacec;background:#f8faff}.option.selected{border:2px solid var(--blue);background:#eff3ff;padding:13px}.option-key{display:flex;flex:0 0 28px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:#eef1f7;font-weight:800}.option.selected .option-key{background:var(--blue);color:white}.quiz-actions,.result-actions{display:flex;justify-content:space-between;gap:12px;margin:18px 0}.result-card{text-align:center;padding:30px;margin-bottom:24px}.result-card h2{margin:5px 0}.score{font-size:64px;font-weight:900;line-height:1.2;color:var(--blue)}.score-label{color:var(--muted)}.result-stats{display:flex;justify-content:center;gap:42px;margin-top:20px}.result-stats b,.result-stats span{display:block}.result-stats b{font-size:22px}.result-stats span{font-size:13px;color:var(--muted)}.wrong-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.wrong-head h3{margin:0}.wrong-list{display:grid;gap:14px}.wrong-item{padding:20px}.wrong-question{font-weight:800;margin-bottom:12px}.review-passage{white-space:pre-wrap;background:#f7f8fc;padding:12px;border-radius:8px;margin-bottom:12px}.review-options p{margin:8px 0;white-space:pre-wrap}.correct-answer{color:var(--red);font-weight:800}.explanation{background:#f3f6ff;padding:13px 15px;border-radius:10px;margin-top:12px;white-space:pre-wrap}.empty{padding:20px;text-align:center;background:#eaf8f1;color:#176b4b;border-radius:12px}@media(max-width:600px){main{margin:18px auto}.topbar{padding:0 16px}.sub{font-size:11px}.subject-card{align-items:flex-start;flex-direction:column}.info-grid{gap:8px}.info-grid>div{padding:12px 5px}.quiz-head{gap:8px}.score-mini{display:none}.question-prompt{font-size:17px}.result-stats{gap:24px}.quiz-actions button{flex:1}}
</style></head>
<body>
<header class="topbar"><a class="brand" href="chinese.html">考前衝刺</a><div class="sub">國文 L5 (段考範圍)翰林版</div></header>
<main>
<section id="home" class="screen active"><div class="hero"><span class="tag">CHINESE</span><h1>考前衝刺</h1><p>隨機抽題，範圍國文L5。</p></div>
<div class="subject-card"><div><div class="subject-title">國文 L5 (段考範圍)翰林版</div><div class="subject-meta">題庫 <b id="bankCount">載入中</b> 題　·　每回隨機 20 題　·　每題 5 分</div></div><button class="primary" id="startBtn">開始測驗</button></div>
<div class="info-grid"><div><b>20 題</b><span>題庫隨機抽題</span></div><div><b>100 分</b><span>每題 5 分</span></div><div><b>自動批改</b><span>錯題附詳解</span></div></div>
<div class="notice">翰林題庫。</div><div id="loadError" class="notice" hidden></div></section>
<section id="quiz" class="screen"><div class="quiz-head"><button class="ghost" id="quitBtn">退出</button><div class="progress-wrap"><div class="progress-text"><span id="qNo">1</span> / <span id="total">20</span></div><div class="progress"><i id="progressBar"></i></div></div><div class="score-mini">每題 5 分</div></div><article class="question-card"><div id="questionMeta" class="question-meta"></div><div id="passage" class="passage" hidden></div><div id="questionText" class="question-prompt"></div><div class="options" id="options"></div></article><div class="quiz-actions"><button id="prevBtn" class="secondary">上一題</button><button id="nextBtn" class="primary">下一題</button></div></section>
<section id="result" class="screen"><div class="result-card"><div class="tag">TEST RESULT</div><h2>測驗完成</h2><div class="score" id="score">0</div><div class="score-label">分</div><div class="result-stats"><div><b id="correctCount">0</b><span>答對</span></div><div><b id="wrongCount">0</b><span>答錯</span></div><div><b id="accuracy">0%</b><span>正確率</span></div></div></div><div class="wrong-head"><h3>錯題與詳解</h3><span id="wrongSummary"></span></div><div id="wrongList" class="wrong-list"></div><div class="result-actions"><button class="secondary" id="homeBtn">回首頁</button><button class="primary" id="againBtn">再測一次</button></div></section>
</main><script src="chinese.js"></script></body></html>
