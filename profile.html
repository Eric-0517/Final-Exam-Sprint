<style>
.side-nav-links a[hidden],
#profileNavLink[hidden] {
  display: none !important;
}

.profile-head {
  display: block;
}

.profile-user {
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.profile-user[hidden] {
  display: none !important;
}

.profile-user > div {
  min-width: 0;
}

.profile-name-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
}

.profile-name-row h1 {
  margin: 0;
}

.profile-access-row {
  margin-top: 0;
}

.access-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  background: #e8f3ff;
  color: #438bd1;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
}

.access-check {
  position: relative;
  display: inline-block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #438bd1;
  flex-shrink: 0;
}

.access-check::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 3px;
  width: 4px;
  height: 7px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.access-badge.inactive {
  display: inline-flex;
  align-items: center;
  background: #e5e7eb;
  color: #6b7280;
  padding: 4px 10px;
  border-radius: 999px;
}

.access-badge.inactive .access-check {
  display: none;
}

.profile-access-days {
  margin-top: 7px;
  color: #6b8eae;
  font-size: 13px;
}

.profile-email {
  margin-top: 7px;
  color: #6b7280;
  font-size: 14px;
  word-break: break-all;
}

.profile-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.profile-progress {
  margin-top: 8px;
  width: 100%;
  max-width: 320px;
}

.profile-progress-track {
  height: 7px;
  overflow: hidden;
  background: #e8edf5;
  border-radius: 99px;
}

.profile-progress-fill {
  height: 100%;
  background: #438bd1;
  border-radius: 99px;
}
</style>

<script>
(() => {
  "use strict";

  const toggle = document.getElementById("navToggle");
  const nav = document.getElementById("sideNav");
  const overlay = document.getElementById("navOverlay");

  if (toggle && nav && overlay) {
    function openNav() {
      toggle.classList.add("active");
      nav.classList.add("open");
      overlay.classList.add("show");
      document.body.classList.add("nav-open");

      toggle.setAttribute("aria-expanded", "true");
      toggle.setAttribute("aria-label", "關閉導覽選單");
      nav.setAttribute("aria-hidden", "false");
      nav.inert = false;
    }

    function closeNav() {
      toggle.classList.remove("active");
      nav.classList.remove("open");
      overlay.classList.remove("show");
      document.body.classList.remove("nav-open");

      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", "開啟導覽選單");
      nav.setAttribute("aria-hidden", "true");
      nav.inert = true;
    }

    toggle.addEventListener("click", () => {
      nav.classList.contains("open") ? closeNav() : openNav();
    });

    overlay.addEventListener("click", closeNav);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeNav();
    });

    nav.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", closeNav);
    });
  }
})();
</script>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));

  const msg = text => {
    const element = $("profileMessage");
    if (element) element.textContent = text;
  };

  function showEmpty(id, text) {
    const element = $(id);
    if (element) {
      element.innerHTML = `<div class="empty">${esc(text)}</div>`;
    }
  }

  function clearPermissionDisplay() {
    const badge = $("profileAccessBadge");

    badge.hidden = true;
    badge.classList.remove("inactive");

    $("profileAccessText").textContent = "已開通";
    $("profileAccessDays").hidden = true;
    $("profileAccessDays").textContent = "";
  }

  function showInactivePermission() {
    const badge = $("profileAccessBadge");

    badge.hidden = false;
    badge.classList.add("inactive");

    $("profileAccessText").textContent = "未開通";
    $("profileAccessDays").hidden = true;
    $("profileAccessDays").textContent = "";
  }

  async function loadUserPermission(userId) {
    clearPermissionDisplay();

    const { data, error } = await window.sb
      .from("user_permissions")
      .select("has_access,plan_days,started_at,expires_at")
      .eq("user_id", userId)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      showInactivePermission();
      return;
    }

    const planDays = Number(data.plan_days);
    const isPermanent = planDays === 0;

    const expiresAt = data.expires_at
      ? new Date(data.expires_at).getTime()
      : null;

    const isValid = data.has_access === true &&
      (
        isPermanent ||
        (
          expiresAt !== null &&
          Number.isFinite(expiresAt) &&
          expiresAt > Date.now()
        )
      );

    if (!isValid) {
      showInactivePermission();
      return;
    }

    const badge = $("profileAccessBadge");
    badge.hidden = false;
    badge.classList.remove("inactive");

    $("profileAccessDays").hidden = false;

    if (isPermanent) {
      $("profileAccessDays").textContent = "授權期限：永久授權";
      return;
    }

    const remainingDays = Math.max(
      0,
      Math.ceil((expiresAt - Date.now()) / 86400000)
    );

    const planName = [30, 60, 90].includes(planDays)
  ? `${planDays} 天方案`
  : "限期授權";

$("profileAccessDays").textContent =
  `授權期限：剩餘 ${remainingDays} 天`;
  }

  async function loadProfile() {
    if (!window.sb) return;

    try {
      const {
        data: { session },
        error: sessionError
      } = await window.sb.auth.getSession();

      if (sessionError) throw sessionError;

      const loggedIn = Boolean(session);

      $("signedOut").hidden = loggedIn;
      $("profileUser").hidden = !loggedIn;
      $("profileGoogleLoginBtn").hidden = loggedIn;
      $("profileLogoutBtn").hidden = !loggedIn;

      if (!loggedIn) {
        clearPermissionDisplay();

        ["attempts", "wrongQuestions", "watchHistory", "sessions"]
          .forEach(id => showEmpty(id, "請先使用 Google 登入。"));

        return;
      }

      const user = session.user;
      const metadata = user.user_metadata || {};

      $("profileName").textContent =
        metadata.full_name || metadata.name || user.email || "使用者";

      $("profileEmail").textContent = user.email || "";

      const avatar = metadata.avatar_url || metadata.picture || "";

      if (avatar) {
        $("profileAvatar").src = avatar;
        $("profileAvatar").hidden = false;
      } else {
        $("profileAvatar").hidden = true;
      }

      await loadUserPermission(user.id);

      if (!window.StudyData) {
        throw new Error("StudyData 尚未載入。");
      }

      const [attempts, wrong] = await Promise.all([
        StudyData.getAttempts(),
        StudyData.getWrongQuestions()
      ]);

      $("attempts").innerHTML = attempts.length ? `
        <table class="profile-table">
          <thead>
            <tr>
              <th>日期</th>
              <th>科目</th>
              <th>分數</th>
              <th>正確率</th>
            </tr>
          </thead>
          <tbody>
            ${attempts.map(a => `
              <tr>
                <td>${esc(new Date(a.created_at).toLocaleString("zh-TW"))}</td>
                <td>${esc(a.subject)}</td>
                <td>${esc(a.score)}</td>
                <td>${a.total_questions
                  ? Math.round(a.correct_count / a.total_questions * 100)
                  : 0}%</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      ` : '<div class="empty">目前還沒有成績紀錄。</div>';

      $("wrongQuestions").innerHTML = wrong.length
        ? wrong.map(w => {
            const q = w.question_snapshot || {};
            const title = q.question || q.questionText ||
              ("題目 ID：" + w.question_id);

            return `
              <div class="profile-item">
                <div class="profile-item-title">
                  ${esc(w.subject)}｜${esc(title)}
                </div>
                <div class="muted">
                  最近答案：${esc(w.last_answer || "未作答")}；
                  累計答錯：${esc(w.wrong_count)} 次；
                  ${w.is_mastered ? "已熟悉" : "尚未熟悉"}
                </div>
                <button class="small-btn" data-mastered="${esc(w.id)}">
                  ${w.is_mastered ? "取消已熟悉" : "標記已熟悉"}
                </button>
              </div>
            `;
          }).join("")
        : '<div class="empty">目前沒有錯題紀錄。</div>';

      const { data: history, error: historyError } = await window.sb
        .from("video_watch_history")
        .select("id,video_id,video_title,category,watched_at,last_position_seconds,duration_seconds,completed_at")
        .eq("user_id", user.id)
        .order("watched_at", { ascending: false })
        .limit(100);

      if (historyError) throw historyError;

      $("watchHistory").innerHTML = history.length
        ? history.map(item => {
            const position = Number(item.last_position_seconds || 0);
            const duration = Number(item.duration_seconds || 0);

            const progress = duration > 0
              ? Math.min(100, Math.round(position / duration * 100))
              : 0;

            const timeText = seconds => {
              const mins = Math.floor(seconds / 60);
              const secs = Math.floor(seconds % 60);
              return `${mins}:${String(secs).padStart(2, "0")}`;
            };

            return `
              <div class="profile-item">
                <div class="profile-item-title">
                  ${esc(item.video_title || "未命名影片")}
                </div>

                <div class="muted">
                  ${esc(item.category || "線上影片")}
                  ｜觀看時間：
                  ${esc(new Date(item.watched_at).toLocaleString("zh-TW"))}
                </div>

                <div class="muted">
                  ${item.completed_at
                    ? "已完成觀看"
                    : duration > 0
                      ? `觀看進度：${timeText(position)} / ${timeText(duration)}（${progress}%）`
                      : "尚無播放進度資料"}
                </div>

                ${duration > 0 ? `
                  <div class="profile-progress">
                    <div class="profile-progress-track">
                      <div class="profile-progress-fill"
                        style="width:${item.completed_at ? 100 : progress}%">
                      </div>
                    </div>
                  </div>
                ` : ""}
              </div>
            `;
          }).join("")
        : '<div class="empty">目前還沒有觀看紀錄。</div>';

      const {
        data: sessions,
        error
      } = await window.sb.from("quiz_sessions")
        .select("*")
        .order("updated_at", { ascending: false });

      if (error) throw error;

      $("sessions").innerHTML = sessions.length
        ? sessions.map(s => `
            <div class="profile-item">
              <div class="profile-item-title">
                ${esc(s.quiz_name)}（${esc(s.subject)}）
              </div>
              <div class="muted">
                已作答 ${Object.keys(s.answers || {}).length} 題；
                目前題號 ${Number(s.current_index || 0) + 1}；
                更新於 ${esc(new Date(s.updated_at).toLocaleString("zh-TW"))}
              </div>
              <a class="small-btn"
                style="display:inline-block;text-decoration:none"
                href="${esc(s.subject)}.html">前往科目</a>
            </div>
          `).join("")
        : '<div class="empty">目前沒有未完成測驗。</div>';

      msg("");

    } catch (error) {
      console.error("載入個人中心資料失敗：", error);
      msg("載入資料失敗，請確認登入狀態、Supabase 資料表與 RLS 設定。");
    }
  }

  document.addEventListener("click", async event => {
    const target = event.target;
    if (!(target instanceof Element)) return;

    const button = target.closest("[data-mastered]");
    if (!button) return;

    try {
      const id = button.dataset.mastered;

      const { data, error } = await window.sb.from("wrong_questions")
        .select("is_mastered")
        .eq("id", id)
        .single();

      if (error) throw error;

      await StudyData.setMastered(id, !data.is_mastered);
      await loadProfile();

    } catch (error) {
      console.error("更新錯題狀態失敗：", error);
      msg("更新錯題狀態失敗。");
    }
  });

  $("profileLogoutBtn").addEventListener("click", async () => {
    try {
      const { error } = await window.sb.auth.signOut();
      if (error) throw error;
      location.reload();
    } catch (error) {
      console.error("登出失敗：", error);
      msg("登出失敗，請稍後再試。");
    }
  });

  $("profileGoogleLoginBtn").addEventListener("click", async () => {
    try {
      const { error } = await window.sb.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: location.origin + location.pathname
        }
      });

      if (error) throw error;
    } catch (error) {
      console.error("Google 登入失敗：", error);
      msg("Google 登入失敗，請稍後再試。");
    }
  });

  async function initProfile() {
    if (!window.sb) {
      msg("Supabase 尚未載入，請稍後重新整理。");
      return;
    }

    await loadProfile();

    window.sb.auth.onAuthStateChange(() => {
      setTimeout(loadProfile, 0);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initProfile, {
      once: true
    });
  } else {
    initProfile();
  }
})();
</script>
