    class="nav-toggle"

    aria-expanded="false"
    aria-controls="sideNav"

    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<div class="nav-overlay" id="navOverlay"></div>

<nav class="side-nav" id="sideNav" aria-hidden="true" inert>
  <div class="side-nav-title">網站導覽</div>
  <a href="index.html">首頁 <span>›</span></a>
  <a href="studynotes.html">重點整理 <span>›</span></a>
  <a href="https://score-1.exchuan.com.tw/#" target="_blank" rel="noopener noreferrer">成績查詢 <span>›</span></a>
  <a href="downloads.html" aria-current="page">檔案下載 <span>›</span></a>
  <a href="profile.html" id="profileNavLink" hidden>個人中心 <span>›</span></a>

  <div class="nav-account">

      <button id="logoutBtn" type="button">
        登出 Google 帳號

    <button class="google-login-btn" id="googleLoginBtn" type="button">

    </div>
  </div>
</nav>

<main id="app">
  <section class="screen active">

    <div class="hero downloads-hero">
      <span class="tag">FILE CENTER</span>
      <h1>檔案下載</h1>
      <p>找不到檔案？那是你眼睛有問題，開完鬧的，可以直接搜尋關鍵字下載。</p>
    </div>

    <div class="download-toolbar">
      <input
        type="search"
        id="downloadSearch"
        class="download-search"
        placeholder="搜尋檔案名稱..."
        aria-label="搜尋檔案名稱"
      >

      <button
        type="button"
        class="download-refresh"
        id="refreshFiles"
      >重新整理</button>
    </div>

    <div class="download-status" id="downloadStatus" role="status" aria-live="polite">
      正在讀取檔案清單…
    </div>

    <div class="download-list" id="downloadList"></div>

    <div class="download-empty" id="downloadEmpty">
      目前沒有符合條件的檔案。
    </div>

    <div class="download-notice">
      <strong>檔案下載說明</strong>
      <p>這個......你要問....</p>
    </div>

  </section>
</main>

  <a href="terms.html">服務條款</a>
  <p>聯絡方式(Gmail)：dev@eric0517.dpdns.org</p>
</footer>

<script>
(() => {
  "use strict";

  const OWNER = "Eric-0517";
  const REPO = "Final-Exam-Sprint";
  const BRANCH = "main";
  const FOLDER = "files";

  const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;

  const RAW_BASE =
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FOLDER}/`;

  const ALLOWED_EXTENSIONS = new Set([
    "pdf", "doc", "docx", "xls", "xlsx",
    "ppt", "pptx", "txt", "csv", "zip",
    "rar", "7z", "json", "jpg", "jpeg",
    "png", "webp", "mp3", "mp4"
  ]);

  const toggle = document.getElementById("navToggle");
  const nav = document.getElementById("sideNav");
  const overlay = document.getElementById("navOverlay");

  if (toggle && nav && overlay) {
    function openNav() {
      toggle.classList.add("active");
      nav.classList.add("open");
      overlay.classList.add("show");
      document.body.classList.add("nav-open");

      toggle.setAttribute("aria-expanded", "true");
      toggle.setAttribute("aria-label", "關閉導覽選單");
      nav.setAttribute("aria-hidden", "false");
      nav.inert = false;
    }

    function closeNav() {
      toggle.classList.remove("active");
      nav.classList.remove("open");
      overlay.classList.remove("show");
      document.body.classList.remove("nav-open");

      toggle.setAttribute("aria-expanded", "false");
      toggle.setAttribute("aria-label", "開啟導覽選單");
      nav.setAttribute("aria-hidden", "true");
      nav.inert = true;
    }

    toggle.addEventListener("click", () => {
      nav.classList.contains("open") ? closeNav() : openNav();
    });

    overlay.addEventListener("click", closeNav);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeNav();
    });

    nav.querySelectorAll("a").forEach(link => {
      link.addEventListener("click", closeNav);
    });
  }

  const searchInput = document.getElementById("downloadSearch");
  const list = document.getElementById("downloadList");
  const status = document.getElementById("downloadStatus");
  const empty = document.getElementById("downloadEmpty");
  const refreshButton = document.getElementById("refreshFiles");

  let files = [];

  function getExtension(filename) {
    const index = filename.lastIndexOf(".");
    return index >= 0
      ? filename.slice(index + 1).toLowerCase()
      : "";
  }

  function formatSize(bytes) {
    if (typeof bytes !== "number") return "檔案";

    if (bytes < 1024) return `${bytes} B`;

    if (bytes < 1024 * 1024) {
      return `${(bytes / 1024).toFixed(1)} KB`;
    }

    return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
  }

  function createElement(tag, className, text) {
    const element = document.createElement(tag);

    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;

    return element;
  }

  function renderFiles() {
    const keyword = searchInput.value.trim().toLowerCase();

    const filtered = files.filter(file =>
      file.name.toLowerCase().includes(keyword) ||
      getExtension(file.name).includes(keyword)
    );

    list.replaceChildren();

    filtered.forEach(file => {
      const card = createElement("article", "download-card");
      const meta = createElement("div", "download-meta");
      const extension = getExtension(file.name).toUpperCase() || "FILE";
      const tag = createElement("span", "download-tag", extension);

      meta.appendChild(tag);

      const title = createElement("h2", "", file.name);
      title.title = file.name;

      const description = createElement(
        "p",
        "",
        `檔案格式：${extension}｜大小：${formatSize(file.size)}`
      );

      const button = createElement("a", "download-button", "下載檔案");

      button.href = file.download_url || RAW_BASE + file.path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

      button.setAttribute("download", file.name);
      button.rel = "noopener";

      card.append(meta, title, description, button);
      list.appendChild(card);
    });

    empty.classList.toggle("show", filtered.length === 0);

    if (files.length > 0 && filtered.length === 0) {
      empty.textContent = "找不到符合條件的檔案，試試其他關鍵字。";
    } else {
      empty.textContent = "目前沒有可下載的檔案。";
    }

    if (files.length > 0) {
      status.textContent =
        `共找到 ${files.length} 個檔案，目前顯示 ${filtered.length} 個。`;
    }
  }

  async function loadFiles() {
    refreshButton.disabled = true;
    searchInput.disabled = true;
    status.textContent = "正在讀取檔案清單…";
    list.replaceChildren();
    empty.classList.remove("show");

    try {
      const response = await fetch(API_URL, {
        headers: {
          Accept: "application/vnd.github+json"
        }
      });

      if (response.status === 404) {
        files = [];
        status.textContent = "尚未找到 files 資料夾。";
        empty.textContent = "目前沒有可下載的檔案。";
        empty.classList.add("show");
        return;
      }

      if (response.status === 403 || response.status === 429) {
        throw new Error("觸發限制，請稍後再試。");
      }

      if (!response.ok) {
        throw new Error(`讀取失敗（HTTP ${response.status}）。`);
      }

      const data = await response.json();

      if (!Array.isArray(data)) {
        throw new Error("files 路徑不是可讀取的資料夾。");
      }

      files = data.filter(item =>
        item.type === "file" &&
        ALLOWED_EXTENSIONS.has(getExtension(item.name))
      );

      files.sort((a, b) =>
        a.name.localeCompare(b.name, "zh-Hant")
      );

      renderFiles();

      if (files.length === 0) {
        status.textContent = "資料夾目前沒有支援的檔案。";
        empty.textContent = "請上傳至 files 資料夾。";
        empty.classList.add("show");
      }
    } catch (error) {
      files = [];
      status.textContent = error.message || "讀取檔案時發生錯誤。";
      empty.textContent = "無法取得檔案清單，請稍後再試。";
      empty.classList.add("show");
    } finally {
      refreshButton.disabled = false;
      searchInput.disabled = false;
    }
  }

  searchInput.addEventListener("input", renderFiles);
  refreshButton.addEventListener("click", loadFiles);

  loadFiles();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
